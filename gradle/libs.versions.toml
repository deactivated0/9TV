[versions]
desugar_jdk_libs = "2.0.4"
media3 = "1.1.1" # API 16+ (1.2.0+ requires API 19+)
nanohttpd = "2.3.1"
recyclerview = "1.3.1" # API 14+ (1.3.2+ requires API 19+)
zxing = "3.3.3" # API 14+ Java 7 (3.4.0+ requires API 19+)
glide = "4.16.0" # API 14+ Java 7

gson = "2.9.1" # API 14+ (2.10.0+ requires API 19+)
okhttp = "3.12.13" # Last branch supporting Android 4.0+ (API 14+)
retrofit = "2.6.4" # Last branch supporting Android 4.0+ (API 14+)
conscrypt = "2.5.2" # API 14+

work = "2.8.1"
core_ktx = "1.9.0" # API 14+ (1.10.0+ requires API 19+)
lifecycle = "2.5.1" # API 14+ (2.6.0+ requires API 19+)
constraintlayout = "2.1.4" # API 14+
serialization = "1.6.3"
coroutines = "1.6.4" # API 14+

android-gradle-plugin = "8.3.2"
kotlin-android = "1.9.24"
appcompat = "1.6.1" # API 14+
activity = "1.6.1" # API 14+
fragment = "1.5.7" # API 14+
multidex = "2.0.1" # API 14+

[libraries]
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }

media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core_ktx" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-android" }
